<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2017"/>
      <stop offset="100%" stop-color="#05120c"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Compass Rings -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.12"/>

  <!-- WildCraft Tree Symbol -->
  <!-- Top Tier -->
  <polygon points="32,15 22,27 42,27" fill="url(#treeGrad)" filter="url(#glow)"/>
  <!-- Middle Tier -->
  <polygon points="32,23 18,37 46,37" fill="url(#treeGrad)"/>
  <!-- Bottom Tier -->
  <polygon points="32,33 14,49 50,49" fill="url(#treeGrad)"/>
  <!-- Tree Trunk -->
  <rect x="29.5" y="49" width="5" height="6" rx="1.5" fill="#a16207"/>

  <!-- North Star / Beacon Summit Sparkle -->
  <polygon points="32,8 33.5,12 37.5,13.5 33.5,15 32,19 30.5,15 26.5,13.5 30.5,12" fill="url(#starGrad)"/>
  <circle cx="32" cy="13.5" r="1.5" fill="#ffffff"/>
</svg>